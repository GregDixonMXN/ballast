# Optional development database only. Local JSON storage needs no Docker.
# The trust-authenticated database is intentionally loopback-only. Never use
# this development configuration on a public/shared host.
name: ballast-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ballast_dev
      POSTGRES_DB: ballast_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballast_dev -d ballast_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
